[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "atlas-pmos"
version = "0.6.0"
description = "Atlas PMOS - an enterprise property management operating system"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "iBuilder" }]
keywords = ["property-management", "flask", "erp", "accounting", "maintenance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Flask",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "Flask>=3.1,<4",
  "Flask-SQLAlchemy>=3.1,<4",
  "Flask-Migrate>=4.1,<5",
  "Flask-Login>=0.6.3,<0.7",
  "Flask-WTF>=1.2,<2",
  "Flask-Limiter>=3.8,<5",
  "Flask-Caching>=2.3,<3",
  "flask-talisman>=1.1,<2",
  "SQLAlchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "email-validator>=2.2,<3",
  "argon2-cffi>=23.1,<26",
  "pyotp>=2.9,<3",
  "cryptography>=43,<52",
  "itsdangerous>=2.2,<3",
  "redis>=5.1,<9",
  "celery>=5.4,<6",
  "gunicorn>=23,<27",
  "prometheus-client>=0.21,<1",
  "bleach>=6.1,<7",
  "python-dateutil>=2.9,<3",
  "PyJWT>=2.9,<3",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
#: XLSX report output. Everything else renders with the standard library.
reports = ["openpyxl>=3.1,<4"]
#: SAML signature verification. Deliberately not hand-rolled: a subtly wrong
#: XML-DSIG implementation accepts forged assertions while appearing to work.
saml = ["signxml>=4.0,<5", "lxml>=5.2,<7"]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.7,<1",
  "black>=24.8,<27",
  "mypy>=1.11,<2",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
  "freezegun>=1.5,<2",
  "pytest-timeout>=2.3,<3",
  "types-bleach",
  "types-python-dateutil",
  "signxml>=4.0,<5",
  "lxml>=5.2,<7",
  "openpyxl>=3.1,<4",
]

[project.urls]
Homepage = "https://github.com/ibuilder/atlas"
Documentation = "https://ibuilder.github.io/atlas/"
Repository = "https://github.com/ibuilder/atlas"
Changelog = "https://github.com/ibuilder/atlas/blob/main/CHANGELOG.md"

[project.scripts]
atlas = "app.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --------------------------------------------------------------------------
# Tooling
# --------------------------------------------------------------------------

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # isort
  "B",    # bugbear
  "C4",   # comprehensions
  "UP",   # pyupgrade
  "S",    # bandit-ish
  "T20",  # no print
  "RET",  # return consistency
  "SIM",  # simplify
  "TID",  # tidy imports
  "PL",   # pylint subset
]
ignore = [
  "E501",     # line length handled by black
  "PLR0913",  # many args - service signatures are explicit by design
  "PLR2004",  # magic values in domain code
  "B008",     # Depends-style defaults
  # Function-level imports are deliberate here: the factory, the models, and the
  # services form a cycle at module scope (extensions needs the base, models
  # need extensions), and deferring those imports is what keeps the application
  # factory pattern working. Enforcing top-level imports would mean reshaping
  # the architecture around a lint rule.
  "PLC0415",
  "PLR0912",  # branch count - state machines and policy evaluation are branchy
  "PLR0915",  # statement count, same reason
  "PLW2901",  # loop variable overwrite, idiomatic in normalisation loops
  "PLR0911",  # return count - guard-clause style is preferred to nesting here
  "PLR0917",  # positional args - service signatures are keyword-only anyway
  "C416",     # comprehensions over SQLAlchemy ScalarResult are not redundant
  "PLW0603",  # module-level toggles (strict tenancy, cipher) are deliberate
  # Readability preferences that make security-relevant code harder to follow:
  # collapsing the nested checks in the policy engine, or replacing the explicit
  # dummy-verify try/except with contextlib.suppress, hides the reasoning the
  # comments there exist to explain.
  "SIM102",
  "SIM105",
  "SIM108",
  # S105/S106 flag any string literal containing "password", "token", or "pass".
  # Every occurrence in this codebase is domain vocabulary, not a credential:
  # audit action names ("auth.password_changed"), redaction key lists, session
  # cookie key names, and an inspection result literally called PASS. Real
  # secrets come from configuration and are typed as SecretStr. Bandit - the
  # actual security scanner - is configured the same way, for the same reason.
  "S105",
  "S106",
  # Separate date/datetime branches read more clearly than a merged isinstance
  # in the audit serialiser, where the two cases are conceptually different.
  "SIM101",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "PLR2004", "S311"]
"app/cli/*" = ["T20", "S105", "S106"]
"scripts/*" = ["T20", "S101"]
# These modules enumerate the *names* of sensitive fields (for redaction) and
# permission codes (for the catalogue). Ruff reads string literals containing
# "password" or "token" as hardcoded credentials; here they are the opposite -
# the list of things that must never be stored or logged.
"app/logging.py" = ["S105"]
"app/security/permissions.py" = ["S105", "S106"]
"app/security/session.py" = ["S105"]
"app/services/iam/*" = ["S105", "S106"]
"app/api/v1/routes/auth.py" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = []
exclude = ["migrations/", "build/", "\\.venv/"]

#: `ignore_missing_imports` above is for third-party packages that ship no
#: stubs. Applied to our own code it silently accepts an import of a module
#: that does not exist - which is how `from app.models.assets import Space`
#: type-checked clean against a package that only has `asset_graph`. Turned
#: back off for first-party imports, where a missing module is a typo.
[[tool.mypy.overrides]]
module = "app.*"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
#: A hung test otherwise holds a CI runner for the six-hour default. The point
#: is not the limit - no honest test here takes a minute - it is that a hang
#: fails with the name of the test that hung instead of a cancelled job.
timeout = 60
timeout_method = "thread"
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
  "unit: fast isolated tests",
  "integration: database-backed workflow tests",
  "security: authorization and hardening boundary tests",
  "contract: external adapter contract tests",
  "migration: alembic upgrade/downgrade safety tests",
  "performance: latency and query-count budgets",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations", "build"]
# B105/B106 flag string literals containing "password" or "token". In Atlas
# those literals are audit action names ("auth.password_changed"), redaction
# key lists, and session-cookie key names - the inventory of things that must
# never be stored, not stored secrets. Real credentials come from configuration
# and are typed as SecretStr, which bandit does not flag.
skips = ["B105", "B106"]
