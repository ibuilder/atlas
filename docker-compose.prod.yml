# A deployable Atlas. Portable on purpose: anywhere Docker runs.
#
# Deliberately *not* an extension of docker-compose.yml. That file exists to
# get a developer running in one command, and every convenience in it — a
# default secret, an exposed database port, HTTPS off — is a liability here.
# Layering overrides on top of it means a forgotten `-f` deploys the
# development defaults, and that failure is silent. A separate file cannot be
# half-applied.
#
#   cp .env.production.example .env.production
#   # fill it in — see below; nothing here has a default that would boot
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Every secret is `${VAR:?...}`: unset means compose refuses to start and says
# which one. The application refuses too — see DEPLOYMENT.md §2 — but failing
# at compose is a second earlier and names the variable rather than the config
# field.
#
# What this does not do for you: TLS termination, backups, and log shipping.
# See DEPLOYMENT.md §8. Put this behind a reverse proxy that terminates TLS.
#
# SPDX-License-Identifier: MIT

name: atlas

x-app: &app
  image: ${ATLAS_IMAGE:-ghcr.io/ibuilder/atlas:0.7.1}
  restart: unless-stopped
  environment: &app-env
    ATLAS_ENV: production
    DATABASE_URL: postgresql+psycopg://atlas:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/atlas
    REDIS_URL: redis://redis:6379/0

    # Both must be at least 32 characters and neither may be a placeholder;
    # production refuses to boot otherwise. Generate with:
    #   python -c "import secrets; print(secrets.token_urlsafe(48))"
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
    # And this one with:
    #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
    #
    # Back it up somewhere with a *different blast radius* from the database.
    # If it is in the same secret store and that store is what you lose, the
    # restore comes back and every encrypted column is unreadable.
    FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY}
    WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:?set WEBHOOK_SIGNING_SECRET}

    FORCE_HTTPS: "true"
    SESSION_COOKIE_SECURE: "true"
    # No wildcard. Production refuses `*`, and a browser-facing deployment that
    # allowed it would hand any origin an authenticated session.
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

    # How many reverse proxies sit in front of this. The web port below is
    # bound to loopback precisely so that one does, and until this matches
    # reality every request appears to come from the proxy rather than from a
    # person. That is not cosmetic: the address is written into the FCRA
    # screening-consent record, into every audit event, into login history, and
    # into the per-address rate-limit key. An IP-restricted API token would
    # accept every caller, because they all look like the proxy.
    #
    # Left at 0 by default deliberately - trusting `X-Forwarded-For` with no
    # proxy in front lets any client name its own address, and a spoofable
    # consent record is worse than an obviously wrong one. Set it to the number
    # of proxies you actually run, counted from the outside in.
    TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-0}

    # The address people reach this at. Builds the password-reset link and the
    # server URL in the OpenAPI document, so a wrong value is not cosmetic: the
    # reset mail points somewhere unreachable, and whoever clicks it is already
    # locked out. Production refuses a localhost or plain-HTTP value.
    APP_URL: ${APP_URL:?set APP_URL}

    LOG_FORMAT: json

    # Production refuses local disk for documents: it is not durable across
    # replicas, and a restore that comes back without them is a restore that
    # failed quietly. MinIO satisfies that with no cloud account, which is what
    # keeps this file deployable anywhere. Point these at S3, R2, or Spaces
    # instead and delete the `minio` services below.
    STORAGE_BACKEND: s3
    STORAGE_BUCKET: ${STORAGE_BUCKET:-atlas-documents}
    STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
    STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
    AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY}
    AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY}

    # Production refuses the console mail backend too, and rightly: delinquency
    # notices carry statutory response deadlines, and a backend that prints
    # them to a log has not sent them.
    MAIL_BACKEND: smtp
    MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
    SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}

    MALWARE_SCANNER: clamav
    CLAMAV_HOST: clamav
    CLAMAV_PORT: "3310"
  volumes:
    - atlas-instance:/app/instance
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    clamav:
      condition: service_healthy
    # The bucket has to exist before anything tries to write a document into
    # it, and a first upload failing on a missing bucket looks like a storage
    # outage rather than a setup step.
    createbucket:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: atlas
    # No published port. The development file exposes 5432 so you can attach a
    # client; here that is the database on the internet.
    volumes:
      - atlas-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - atlas-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - atlas-clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      # The first start downloads signatures and takes several minutes. The
      # app waits on this rather than releasing unscanned uploads, so a slow
      # first boot is the system working.
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 300s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY}
    # Not published. The application reaches it on the compose network; nothing
    # outside needs to, and an object store on the internet holding scanned
    # lease documents is the incident this file exists to avoid.
    volumes:
      - atlas-objects:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  createbucket:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    # Idempotent: `mb --ignore-existing` on every start, so a restart is not a
    # failure and a fresh volume is not a manual step somebody forgets.
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${BUCKET} &&
      mc anonymous set none local/$${BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY}
      BUCKET: ${STORAGE_BUCKET:-atlas-documents}

  migrate:
    <<: *app
    # Migrations run once, as their own container, rather than on web start.
    # Two web replicas starting together would otherwise race the same
    # migration, and Alembic's lock turns that into a deploy that hangs.
    restart: "no"
    command: ["flask", "--app", "wsgi", "db", "upgrade"]

  web:
    <<: *app
    command:
      - gunicorn
      - --bind=0.0.0.0:8000
      - --workers=${WEB_WORKERS:-4}
      - --timeout=60
      - --access-logfile=-
      - wsgi:app
    ports:
      # Bound to loopback: put a TLS-terminating proxy in front. Publishing
      # this on 0.0.0.0 serves the application over plain HTTP to the world,
      # while FORCE_HTTPS above makes it redirect to a scheme it is not
      # actually being served on.
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Readiness, not liveness: it refuses traffic while a migration is
      # pending, which is exactly what a rolling deploy needs to wait on.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz', timeout=5).status == 200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    command: ["celery", "-A", "app.tasks.celery_app:make_celery()", "worker", "--loglevel=info"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    <<: *app
    # Exactly one. Two beats double every scheduled job, and the jobs that
    # matter here — delinquency notices, disposition deadlines — are ones
    # nobody wants sent twice.
    deploy:
      replicas: 1
    command: ["celery", "-A", "app.tasks.celery_app:make_celery()", "beat", "--loglevel=info"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  atlas-db:
  atlas-objects:
  atlas-redis:
  atlas-clamav:
  atlas-instance:
