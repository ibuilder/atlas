# Alembic configuration.
#
# The database URL is not set here on purpose - it comes from the application
# settings at runtime, so a migration can never be pointed at a different
# database from the one the app is configured for.
#
# SPDX-License-Identifier: MIT

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

# Generated migrations are formatted on write so they land in review already
# matching the project's style. Ruff is not run here - it is not exposed as a
# console_scripts entrypoint in every environment, and a missing formatter must
# not be able to fail a migration generation.
[post_write_hooks]
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
