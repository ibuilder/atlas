# Publish the image a deployment actually pulls.
#
# CI already builds, SBOMs, and scans this image on every push — and then
# throws it away. That is fine for catching a broken Dockerfile and useless to
# somebody deploying: `docker-compose.prod.yml` names an image tag, and until
# this workflow runs, that tag does not exist. A compose file offering an image
# nobody can pull is worse than one offering none, because it fails on their
# machine rather than ours.
#
# Triggered by a tag, not by a push to main. What gets deployed should be a
# thing somebody named.
#
# SPDX-License-Identifier: MIT

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the packaged version
        # A v0.6.1 tag on a tree that says 0.6.0 publishes an image whose
        # /api/v1 reports a version it is not. Cheaper to fail here.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag packaged=$packaged"
          test "$tag" = "$packaged"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to the registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile
          # arm64 as well as amd64: "deploy anywhere" includes an Apple laptop
          # and the cheaper half of most cloud providers' instance types.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # By digest, not by tag. `github.ref_name` is `v0.7.0`; the tag actually
      # published is `0.7.0`, because docker/metadata-action strips the `v` from
      # a semver pattern. Asking for `:v0.7.0` got MANIFEST_UNKNOWN and took the
      # scan and the draft release down with it, on a release whose image had
      # already published perfectly well.
      #
      # The digest avoids re-deriving a name that is constructed somewhere else,
      # and pins the exact artifact just pushed rather than whatever the tag
      # points at by the time these steps run.
      - name: Generate SBOM for the published image
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: atlas-sbom.spdx.json

      - name: Scan the published image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          # Reported rather than gating, matching CI. A base-image CVE
          # published between the build and the scan should be visible, not a
          # reason the release silently does not exist.
          exit-code: "0"

  release:
    name: Draft the GitHub release
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Take the notes from the changelog
        # Rather than generating them from commit subjects. The changelog says
        # what changed for a *reader*; a commit list says what changed for git.
        run: |
          python - <<'PY' > release-notes.md
          import pathlib, re
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          sections = re.split(r"^## \[", text, flags=re.MULTILINE)
          for section in sections:
              if section.startswith("${{ github.ref_name }}".lstrip("v")):
                  body = section.split("\n", 1)[1]
                  print(body.rstrip())
                  break
          else:
              print("See CHANGELOG.md.")
          PY
          cat release-notes.md

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          draft: true
          generate_release_notes: false
